name: red-news-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # každých 5 minut (GitHub to občas o pár minut zpozdí)
  workflow_dispatch:
    inputs:
      test:
        description: "Testovací běh (pošle stav zdrojů + ukázku skórování)"
        type: boolean
        default: true
      weekly:
        description: "Poslat týdenní souhrn hned"
        type: boolean
        default: false
      weekly_last:
        description: "Souhrn za MINULÝ týden (spolu s předchozím políčkem)"
        type: boolean
        default: false
      value:
        description: "Poslat ranní 💰 (kolik $ přibylo/ubylo) za včerejšek hned"
        type: boolean
        default: false
      evening:
        description: "Poslat večerní přehled (trhy dnes + kalendář na zítřek) hned"
        type: boolean
        default: false
      flows:
        description: "Poslat ranní 💸 toky investorů do ETF hned"
        type: boolean
        default: false
      replay_from:
        description: "Zpětná ukázka zpráv OD (místní čas, např. 2026-11-20 15:30) – jinak nechat prázdné"
        type: string
        default: ""
      replay_to:
        description: "Zpětná ukázka zpráv DO (místní čas, např. 2026-11-20 16:30)"
        type: string
        default: ""

permissions:
  contents: write   # jen kvůli keepalive commitu (viz poslední krok)

concurrency:
  group: red-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Načíst stav z minulého běhu
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Spustit bota
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLAY_FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_from || '' }}
          REPLAY_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_to || '' }}
        run: python3 news_bot.py ${REPLAY_FROM:+--replay-from "$REPLAY_FROM" --replay-to "$REPLAY_TO"} ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.weekly) && '--weekly' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.weekly_last) && '--weeks-back 1' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.value) && '--value' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.evening) && '--evening' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.flows) && '--flows' || '' }}

      - name: Uložit stav
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub vypne naplánované běhy po 60 dnech bez aktivity v repozitáři.
      # Tento krok jednou za 45 dní udělá prázdný commit, aby bot běžel dál.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "red-news-bot"
            git config user.email "red-news-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
